name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/angry-pups-game]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Physics check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every level must stand still on its own and be winnable with its balls.
      - run: node tools/simtest.js

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ship only what the game loads (skip art sources, docs and tools).
      - name: Collect game files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest css js vendor assets _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
